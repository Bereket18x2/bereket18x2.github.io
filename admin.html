    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'night'); }
</script>

<body class="sky">
<canvas id="sky"></canvas>

<div class="harag"></div>
<div class="shell">
  <nav class="nav">
    <a class="brand" href="index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 2v20M2 12h20M7 7l10 10M17 7L7 17"/><circle cx="12" cy="12" r="3.2"/>
      </svg>
      የቅዱሳት መጻሕፍት ትምህርት ቤት
    </a>
    <div class="nav-links">
      <a href="dashboard.html">ትምህርቶች</a>
      <a href="admin.html" aria-current="page">አስተዳደር</a>
    </div>
  </nav>
</div>

<main class="shell section">
  <p class="eyebrow">የመምህራን ገጽ</p>
  <h1 style="font-size:2rem">ተማሪዎች</h1>

  <div class="grid-3" style="margin:22px 0">
    <div class="panel"><p class="eyebrow">ጠቅላላ ተማሪ</p><div class="stat" id="kTotal">…</div></div>
    <div class="panel"><p class="eyebrow">በዚህ ሳምንት ገብተዋል</p><div class="stat" id="kActive">…</div></div>
    <div class="panel"><p class="eyebrow">ጠቅላላ የጥናት ሰዓት</p><div class="stat" id="kHours">…</div></div>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ተማሪ</th><th>ዕድሜ</th><th>ክፍል</th><th>የጥናት ሰዓት</th>
            <th>ትምህርት</th><th>አማካይ</th><th>መጨረሻ የታየበት</th><th>ሁኔታ</th><th>ክፍያ</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <p class="note small" style="margin-top:20px">
    ይህ ገጽ በFirestore ደንብ (<code>role == 'admin'</code>) የተጠበቀ ነው። ክፍያ ማረጋገጥም
    የሚቻለው በመምህር መለያ ብቻ ነው — ተማሪ ቢሞክር ደንቡ ይከለክለዋል።
  </p>
</main>

<script type="module">
import { Store, fmtHours, fmtAgo, toMillis, requireAuth } from '@store';
import { lessonsFor } from '@lessons';
import { TRACKS } from '@validators';
import { completedCount, averageScore } from '@stats';

const me = await requireAuth();

// The rules reject allUsers() for a student anyway; this just turns a
// permission error into an explanation instead of an empty table.
if (me && me.role !== 'admin') {
  document.querySelector('main').innerHTML = `
    <div class="panel">
      <p class="eyebrow">ለመምህራን ብቻ</p>
      <h1 style="font-size:1.6rem;margin:0 0 8px">ይህ ገጽ የመምህራን ነው</h1>
      <p class="muted small">የተማሪዎችን ዝርዝር ማየት የሚችሉት መምህራን ብቻ ናቸው።
        የእርስዎን ትምህርቶች ለማየት ወደ ትምህርቶች ገጽ ይሂዱ።</p>
      <div class="row" style="margin-top:16px">
        <a class="btn btn--gold" href="dashboard.html">ወደ ትምህርቶች</a>
      </div>
    </div>`;
}

if (me && me.role === 'admin') {
let users = [];
try {
  users = await Store.allUsers();
} catch (e) {
  document.getElementById('rows').innerHTML =
    `<tr><td colspan="8" class="muted">${e.message}</td></tr>`;
}

const week = Date.now() - 86400000 * 7;

document.getElementById('kTotal').textContent = users.length;
document.getElementById('kActive').textContent = users.filter(u => toMillis(u.lastSeen) > week).length;
document.getElementById('kHours').textContent =
  Math.round(users.reduce((a, u) => a + (u.studySeconds || 0), 0) / 3600) + ' ሰዓት';

function render(users) {
  document.getElementById('rows').innerHTML = users
    .sort((a, b) => toMillis(b.lastSeen) - toMillis(a.lastSeen))
    .map(u => {
      // count against the student's own course, not the whole catalogue
      const lessons = lessonsFor(u.track);
      const done = completedCount(u.progress, lessons);
      const status = !u.verified ? '<span class="pill">አልተረጋገጠም</span>'
        : !u.paid ? '<span class="pill pill--locked">ክፍያ የለም</span>'
        : '<span class="pill pill--done">ንቁ</span>';
      const payCell = u.paid
        ? `<button class="btn btn--ghost btn--sm" data-uid="${u.uid}" data-paid="0">ክፍያ ሰርዝ</button>`
        : `<button class="btn btn--gold btn--sm" data-uid="${u.uid}" data-paid="1">ክፍያ አረጋግጥ</button>`;

      return `<tr>
        <td><b>${u.studentName ?? '—'}</b><br><span class="muted small">${u.guardianName ?? ''} · ${u.email}</span></td>
        <td class="num">${u.age ?? '—'}</td>
        <td>${TRACKS[u.track]?.am ?? '—'}</td>
        <td class="num">${fmtHours(u.studySeconds)}</td>
        <td class="num">${done}/${lessons.length}</td>
        <td class="num">${averageScore(u.progress)}%</td>
        <td class="muted">${fmtAgo(u.lastSeen)}</td>
        <td>${status}</td>
        <td>${payCell}</td>
      </tr>`;
    }).join('');
}

if (users.length) render(users);

/* Confirming payment is a teacher action. The rules are what actually
   enforce that — this button simply exposes it, and shows whatever the
   write returns rather than assuming it worked. */
document.getElementById('rows').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-uid]');
  if (!btn) return;
  const uid = btn.dataset.uid;
  const next = btn.dataset.paid === '1';
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await Store.setPaid(uid, next);
    const row = users.find(x => x.uid === uid);
    if (row) row.paid = next;
    render(users);
  } catch (ex) {
    btn.disabled = false;
    btn.textContent = label;
    alert(ex.message);
  }
});
}
</script>
<script src="assets/js/sky.js" defer></script>
<script src="assets/js/theme.js" defer></script>
</body>
