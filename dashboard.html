<body class="sky">
<canvas id="sky"></canvas>

<div class="harag"></div>
<div class="shell">
  <nav class="nav">
    <a class="brand" href="index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 2v20M2 12h20M7 7l10 10M17 7L7 17"/><circle cx="12" cy="12" r="3.2"/>
      </svg>
      የቅዱሳት መጻሕፍት ትምህርት ቤት
    </a>
    <div class="nav-links">
      <a href="dashboard.html" aria-current="page">ትምህርቶች</a>
      <a href="admin.html" id="adminLink" style="display:none">አስተዳደር</a>
      <a href="#" id="out">ውጣ</a>
      <button class="theme-toggle" type="button" id="themeToggle" aria-label="ገጽታ ቀይር"></button>
    </div>
  </nav>
</div>

<main class="shell section">
  <div id="authedContent" style="display:none">

    <p class="eyebrow">የተማሪ ገጽ</p>
    <h1 id="hello" style="font-size:2rem;margin-bottom:6px">…</h1>
    <p class="muted small" id="whoami" style="margin-bottom:26px">…</p>

    <div id="payNote" class="note note--red" style="display:none;margin-bottom:22px">
      ክፍያ አልተፈጸመም። ከመጀመሪያው ነጻ ትምህርት በስተቀር ሌሎቹ ተቆልፈዋል።
      <a href="billing.html" style="display:inline-block;margin-top:8px">ክፍያ ፈጽም →</a>
    </div>

    <!-- stat strip -->
    <div class="grid-3" style="margin-bottom:24px">
      <div class="panel">
        <p class="eyebrow">የተጠናቀቁ ትምህርቶች</p>
        <div class="stat" id="doneStat">…</div>
        <div class="meter"><i id="bar" style="width:0%"></i></div>
      </div>
      <div class="panel">
        <p class="eyebrow">አማካይ ውጤት</p>
        <div class="stat" id="avg">…<small>%</small></div>
      </div>
      <div class="panel">
        <p class="eyebrow">አጠቃላይ የጥናት ሰዓት</p>
        <div class="stat" id="hours">…</div>
      </div>
    </div>

    <div class="grid-3" style="margin-bottom:26px">
      <div class="panel">
        <p class="eyebrow">ተከታታይ ቀናት</p>
        <div class="stat" id="streak">…</div>
        <p class="muted small" style="margin:8px 0 0" id="streakNote"></p>
      </div>
      <div class="panel">
        <p class="eyebrow">የትምህርት ክፍል</p>
        <div style="font-family:var(--f-display);font-size:1.15rem" id="trackName">…</div>
        <p class="muted small" style="margin:8px 0 0" id="trackNote"></p>
      </div>
      <div class="panel">
        <p class="eyebrow">መጨረሻ የገቡበት</p>
        <p style="margin:0" id="seen">…</p>
      </div>
    </div>

    <div class="between" style="margin-bottom:14px">
      <h2 style="margin:0;font-size:1.25rem">ትምህርቶች</h2>
      <span class="pill" id="doneCount">…</span>
    </div>
    <div id="list"></div>

  </div>
</main>

<script type="module">
import { Store, fmtHours, fmtAgo, requireAuth } from '@store';
import { lessonsFor, isFree } from '@lessons';
import { TRACKS } from '@validators';
import { streakFrom, averageScore, completedCount, coverageOfLesson, toDate, toGeez } from '@stats';

const $ = id => document.getElementById(id);

// The dashboard itself is not behind the paywall — an unpaid parent must
// be able to see what they have and what is locked.
const u = await requireAuth();

if (u) {
  $('authedContent').style.display = 'block';
  Store.touch();

  const track = TRACKS[u.track];
  const lessons = lessonsFor(u.track);
  const progress = u.progress || {};

  $('hello').textContent = `እንኳን ደህና መጡ፣ ${u.studentName}`;
  $('whoami').textContent = `${u.age} ዓመት · ${track ? track.am : '—'}`;
  $('seen').textContent = fmtAgo(u.lastSeen);
  $('hours').textContent = fmtHours(u.studySeconds);
  $('trackName').textContent = track ? track.am : '—';
  $('trackNote').textContent = track ? track.eligibilityAm : '';
  if (u.role === 'admin') $('adminLink').style.display = '';
  if (!u.paid) $('payNote').style.display = 'block';

  const done = completedCount(progress, lessons);
  $('doneStat').innerHTML = `${toGeez(done) === String(done) ? done : toGeez(done)}<small> / ${toGeez(lessons.length)}</small>`;
  $('doneCount').textContent = `${done} / ${lessons.length} ተጠናቋል`;
  $('bar').style.width = (lessons.length ? (done / lessons.length) * 100 : 0) + '%';
  $('avg').innerHTML = `${averageScore(progress)}<small>%</small>`;

  const streak = streakFrom(progress);
  $('streak').textContent = streak;
  $('streakNote').textContent = streak
    ? 'በተከታታይ ቀናት ተምረዋል — እንዲሁ ይቀጥሉ።'
    : 'ዛሬ አንድ ትምህርት ቢጀምሩ ቆጠራው ይጀምራል።';

  /* Locked lessons are shown, not hidden: a parent should see what the
     subscription opens. The lock is a UI gate — see docs/PAYMENTS.md. */
  $('list').innerHTML = lessons.map(l => {
    const p = progress[l.id];
    const locked = !u.paid && !isFree(l.id);
    const cov = coverageOfLesson(progress, l.id);
    const when = toDate(p?.at) || toDate(p?.completedAt);

    const badge = locked
      ? '<span class="pill pill--locked">🔒 ተቆልፏል</span>'
      : p?.done
        ? `<span class="pill pill--done">${p.score}/${p.of}</span>`
        : `<span class="pill">${l.minutes} ደቂቃ</span>`;

    const bits = [];
    if (isFree(l.id)) bits.push('ነጻ ቅምሻ');
    if (cov !== null) bits.push(`${cov}% ታይቷል`);
    if (when) bits.push(when.toLocaleDateString());
    const detail = bits.length ? ` · ${bits.join(' · ')}` : '';

    const href = locked ? 'billing.html' : `lesson.html?id=${l.id}`;
    return `<a class="folio" href="${href}" data-done="${p?.done ? 1 : 0}" data-locked="${locked ? 1 : 0}">
      <span class="geez">${l.num}</span>
      <span>
        <h3>${l.title}</h3>
        <span class="muted small">${l.teacher}${detail}</span>
      </span>
      ${badge}
    </a>`;
  }).join('') || '<p class="muted">በዚህ ክፍል ገና ትምህርት አልተጨመረም።</p>';

  $('out').addEventListener('click', async (e) => {
    e.preventDefault();
    await Store.signOut();
    location.href = 'index.html';
  });
}
</script>
<script src="assets/js/sky.js" defer></script>
<script src="assets/js/theme.js" defer></script>
</body>
</html>
